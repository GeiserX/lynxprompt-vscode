version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # @types/vscode must never exceed engines.vscode: vsce refuses to package with
      # "@types/vscode X greater than engines.vscode Y", and that only surfaces in
      # publish.yml, never in PR CI. Raising it raises the minimum VS Code we support,
      # so it moves by hand together with engines.vscode.
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
